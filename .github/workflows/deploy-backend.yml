name: Deploy Live backend

on:
  push:
    branches: [web-ui]
    paths:
      - 'src/**'
      - 'web/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/huggingface/**'
      - 'scripts/package-hosting.py'
      - 'scripts/deploy-backend.py'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-live-backend
  cancel-in-progress: false

jobs:
  deploy:
    # Inactive until the owner configures the Space ID in repository variables.
    if: ${{ vars.HF_SPACE_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'huggingface_hub>=0.30,<2'
      - name: Upload allowlisted backend files to the Space
        run: python scripts/deploy-backend.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
